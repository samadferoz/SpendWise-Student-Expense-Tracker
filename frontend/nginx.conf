server {
    listen 80;
    server_name localhost;

    # Root directory for built static assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the backend container over internal Docker network
    
location /api/ {
    proxy_pass https://spendwise-backend-ci48.onrender.com/api/;

    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name spendwise-backend-ci48.onrender.com;

    proxy_set_header Host spendwise-backend-ci48.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
